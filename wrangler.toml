name = "splendor-pokemon-rooms"
main = "worker.mjs"
compatibility_date = "2025-09-01"
workers_dev = true
preview_urls = false

[vars]
GAME_URL = "https://zqpei.github.io/game/splendor-pokemon/"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[ratelimits]]
name = "ROOM_CREATION_LIMIT"
namespace_id = "1001"
simple = { limit = 12, period = 60 }
