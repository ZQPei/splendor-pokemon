name: Deploy Pokémon room server

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pokemon-room-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the game
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets."
            exit 1
          fi
      - name: Deploy room service
        id: rooms
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.162.0'
          command: deploy
        env:
          WRANGLER_SEND_METRICS: 'false'
      - name: Verify public endpoint
        env:
          ROOM_SERVER: ${{ steps.rooms.outputs.deployment-url }}
        run: |
          set -euo pipefail
          if [[ ! "$ROOM_SERVER" =~ ^https://splendor-pokemon-rooms\.[a-z0-9-]+\.workers\.dev/?$ ]]; then
            echo "::error::Expected the public workers.dev room server address."
            exit 1
          fi
          ROOM_SERVER="${ROOM_SERVER%/}"
          curl --fail --silent --show-error --retry 4 --retry-all-errors --max-time 10 \
            -H 'Origin: https://zqpei.github.io' "$ROOM_SERVER/api/health" |
            jq -e '.online == true and .publicOrigin == "https://zqpei.github.io/game/splendor-pokemon/"'
          printf 'Room server: %s\n' "$ROOM_SERVER" >> "$GITHUB_STEP_SUMMARY"
